name: publish

# Run only when a v* tag is pushed (for example v0.1.0).
# Pull requests and regular commits do not publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        # Prevent tagging v0.1.1 on 0.1.0 code.
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Publish to npm
        # Authenticate with NPM_TOKEN from repository secrets.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
